# Frogbot Repository Scan — Azure DevOps Pipeline
#
# Template source: github.com/chaitanyagovande/jfrog-shared-actions
#
# Prerequisites:
#   1. GitHub service connection in ADO Project Settings > Service connections
#      Name it "github-jfrog-shared-actions" (or update endpoint: below to match)
#   2. Variable group "Jfrog-FrogBot" in Pipelines > Library containing:
#       JF_URL            JFrog Platform URL (e.g. https://myorg.jfrog.io)
#       JF_ACCESS_TOKEN   JFrog access token                          [mark secret]
#       JF_GIT_TOKEN      ADO PAT with Code: Read & Write scope       [mark secret]
#       JF_RELEASES_REPO  Artifactory remote repo key proxying releases.jfrog.io
#   3. Variable group must be linked to this pipeline in Pipelines > Library > [group] > Pipeline permissions

schedules:
  - cron: '0 0 * * *'
    displayName: Daily midnight Frogbot scan
    branches:
      include:
        - cust-sel
    always: true

pr: none
trigger: none

# ── OPTION A: Microsoft-hosted agent (use if Artifactory is publicly reachable) ──
pool:
  vmImage: windows-latest
# Required because the template uses frogbot.exe (Windows binary) and PowerShell@2.

# ── OPTION B: Self-hosted agent (use if Artifactory is behind a firewall/VPN) ───
# Create the pool first: Project Settings → Agent pools → Add pool
# Then register an agent in it: https://learn.microsoft.com/azure/devops/pipelines/agents/windows-agent
# pool:
#   name: <your-pool-name>
#   demands:
#     - Agent.OS -equals Windows_NT

variables:
  - group: CG-ASPGoat-Frogbot

resources:
  repositories:
    - repository: jfrog-shared-actions
      type: github
      name: chaitanyagovande/jfrog-shared-actions
      endpoint: github-jfrog-shared-actions   # must match the service connection name in ADO
      ref: refs/heads/main

jobs:
  - job: FrogbotScanRepository
    displayName: 'Frogbot Scan Repository'
    timeoutInMinutes: 30
    steps:
      - template: azure-devops/frogbot-repo-scan-NuGet.yml@jfrog-shared-actions
        parameters:
          frogbotVersion: "2.31.0"
          solutionName: "AspGoat.sln"
          sdkVersion: "8.0.x"
          gitOwner: "chaitanyagovande"      # required
          gitRepo: "AspGoat"               # optional if Build.Repository.Name is owner/repo
